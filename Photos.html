        <div id="lightbox" onclick="lightBox()">

        <script>
          function lightBox(event) {
            const lightbox = document.querySelector("#lightbox");

            if (event) {
              const sourceImage = event.currentTarget.querySelector("img");
              const imgLightbox = lightbox.querySelector("img");
              imgLightbox.onload = setImageContainerSize;
              lightbox.classList.add("active");
              imgLightbox.src = sourceImage.src;
              requestAnimationFrame(setImageContainerSize);
            } else {
              lightbox.classList.remove("active");
            }
          }

          function setImageContainerSize() {
            const image = document.querySelector("#lightbox img");
            const container = document.querySelector(
              "#lightbox .image-container",
            );

            if (!image.complete || !image.naturalWidth) {
              return;
            }

            container.style.width = `${image.offsetWidth}px`;
            container.style.height = `${image.offsetHeight}px`;
          }

          window.addEventListener("resize", setImageContainerSize);
        </script>
